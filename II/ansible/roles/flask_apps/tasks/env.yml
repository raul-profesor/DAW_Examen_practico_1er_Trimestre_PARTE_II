---
# ---------------------------------------------------------------------------
# Creacion del fichero .env de UNA aplicacion.
#
# Se incluye una vez por aplicacion (ver include_tasks en main.yml), asi que
# "app" es la aplicacion de la que se ocupamos.
#
# OJO: si el .env ya existe, se CONSERVA su SECRET_KEY (no se regenera).
# Regenerarla en cada ejecucion haria que el despliegue no fuera idempotente
# y, ademas, invalidaria las sesiones ya firmadas por la aplicacion.
# ---------------------------------------------------------------------------

# OJO: "lookup('file', ...)" lee el fichero en el controlador y devuelve una
# cadena vacia si no existe (con errors="ignore"). Es mas simple y robusto que
# un "slurp" + "b64decode".
#
# El "regex_search" devuelve None si no hay coincidencia, y None no se puede
# encadenar con otros filtros, asi que se comprueba explicitamente con un
# "if". Ademas se convierte a cadena con "| string" porque, si el fichero
# contuviera una clave con caracteres especiales, la expresion podria quedar
# como lista en lugar de texto.
- name: Leer la SECRET_KEY existente (si la hay)
  ansible.builtin.set_fact:
    existing_secret_key: >-
      {% set found = lookup('ansible.builtin.file',
                            apps_root ~ '/' ~ app.name ~ '/.env',
                            errors='ignore')
                   | regex_search('^SECRET_KEY=(.*)$', '\\1', multiline=True) %}
      {{ (found | first | default('', true)) if found else '' }}
  no_log: true

- name: Crear el fichero .env de la aplicacion
  ansible.builtin.copy:
    dest: "{{ apps_root }}/{{ app.name }}/.env"
    content: |
      # Variables de entorno de la aplicacion {{ app.name }}
      # OJO: este fichero NUNCA se sube al repositorio: contiene secretos.
      FLASK_APP={{ app.wsgi_target }}
      FLASK_ENV=production
      SECRET_KEY={{ existing_secret_key | default('', true) or secret_key }}
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: "0640"
  become: true
  no_log: true
