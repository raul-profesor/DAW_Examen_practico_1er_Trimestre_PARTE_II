---
# ===========================================================================
# Despliegue del escenario v3-debug con Ansible
#
# Topologia: NGINX en una maquina y PHP-FPM en otra, comunicandose por
# FastCGI sobre TCP.
#
# Uso habitual (el inventario lo genera Terraform):
#
#   ansible-playbook playbooks/deploy.yml \
#     -i inventory/hosts.ini \
#     --extra-vars "deploy_scenario=v3-debug"
#
# El playbook termina ejecutando las tareas de preparacion del escenario
# (rol debug_scenarios), que forman parte del ejercicio.
# ===========================================================================

- name: Preparacion comun (todas las maquinas)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common, always]

- name: NGINX en la maquina web
  hosts: web
  become: true
  gather_facts: true
  tags: [split, deploy]
  roles:
    - role: nginx
      tags: [nginx, deploy]
    # NGINX necesita el codigo en SU maquina: resuelve SCRIPT_FILENAME
    # localmente a partir de "root" y se lo pasa a PHP-FPM, que lo ejecuta
    # en la otra maquina. Si el codigo solo estuviera en el backend, NGINX
    # responderia 404 ("Primary script unknown").
    - role: app_deploy
      tags: [app, deploy]

- name: PHP-FPM en la maquina de backend
  hosts: fpm
  become: true
  gather_facts: true
  tags: [split, deploy]
  roles:
    - role: php_fpm
      tags: [php, deploy]
    - role: app_deploy
      tags: [app, deploy]

- name: Verificacion del despliegue
  hosts: web
  become: true
  gather_facts: false
  tags: [verify, deploy]
  tasks:
    - name: Comprobar el codigo de estado HTTP del sitio
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code: [200, 404, 502]
        timeout: 15
      register: site_check
      failed_when: false
      changed_when: false

    - name: Mostrar el resultado de la verificacion
      ansible.builtin.debug:
        msg: >-
          HTTP {{ site_check.status | default('sin respuesta') }}
          - {% if site_check.status | default(0) == 200 %}despliegue correcto{% elif site_check.status | default(0) == 502 %}error 502: revisa la comunicacion entre NGINX y PHP-FPM{% elif site_check.status | default(0) == 404 %}error 404: revisa que el codigo este desplegado en la maquina de PHP-FPM{% else %}sin respuesta: revisa que los servicios esten activos{% endif %}

# ---------------------------------------------------------------------------
# Preparacion final del escenario.
#
# Las tareas del rol debug_scenarios se aplican siempre (no llevan ninguna
# etiqueta que permita saltarlas con --skip-tags) y no existe ninguna forma
# de revertirlas desde la automatizacion.
# ---------------------------------------------------------------------------
- name: Preparacion del escenario v3-debug
  hosts: web
  become: true
  gather_facts: false
  roles:
    - role: debug_scenarios
