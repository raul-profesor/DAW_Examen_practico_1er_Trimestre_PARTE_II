[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
timeout = 30

[ssh_connection]
pipelining = True
# IdentitiesOnly=yes evita que SSH ofrezca todas las claves de ~/.ssh al
# servidor (si no, se agota el maximo de intentos y falla el login con
# "Too many authentication failures").
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o IdentitiesOnly=yes
