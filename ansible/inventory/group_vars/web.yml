---
# ---------------------------------------------------------------------------
# Variables especificas del grupo "web" (la maquina con NGINX)
# ---------------------------------------------------------------------------

# En este repositorio la topologia siempre es "split": NGINX habla con
# PHP-FPM por TCP (socket Unix no es posible entre maquinas distintas).
nginx_fpm_mode: tcp

# Version de PHP que aparece en la directiva fastcgi_pass.
# En la topologia split la version no aparece (solo IP:9000), asi que el
# error introducido (a) esta en el security group, no aqui.
fastcgi_socket_version: "{{ php_version }}"

# IP privada de la maquina con PHP-FPM (la que tiene el codigo de la app).
php_fpm_backend: "{{ fpm_private_ip | default(ansible_host) }}"
