---
- name: Instalar NGINX y las extensiones de PHP
  ansible.builtin.apt:
    name: "{{ [nginx_package] + php_packages }}"
    state: present
    update_cache: true
  become: true

- name: Comprobar la version real de PHP instalada
  ansible.builtin.command:
    cmd: php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;'
  register: php_installed_version
  changed_when: false
  failed_when: false

- name: Guardar la version de PHP detectada
  ansible.builtin.set_fact:
    php_installed_version: "{{ php_installed_version.stdout | default(php_version) }}"
    php_version_installed: "{{ php_installed_version.stdout | default(php_version) }}"

- name: Mostrar la version de PHP detectada
  ansible.builtin.debug:
    msg: "PHP-FPM {{ php_version_installed }} (version esperada en la configuracion: {{ php_version }})"

- name: Comprobar que el servicio PHP-FPM esta activo
  ansible.builtin.systemd:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Comprobar que el servicio NGINX esta activo
  ansible.builtin.systemd:
    name: "{{ nginx_package }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

# ---------------------------------------------------------------------------
# Virtual host de NGINX en la maquina de PHP-FPM.
#
# El rol nginx solo se aplica a la maquina "web", pero en esta maquina
# NGINX tambien esta instalado (lo instala el rol php_fpm). Aqui se
# despliega el virtual host con la directiva fastcgi_pass apuntando al
# puerto en el que realmente escucha PHP-FPM (9000).
#
# Ojo: este fichero NO se activa (no se crea el enlace en sites-enabled),
# porque en esta maquina no tiene que servir nada: el trafico entra por la
# maquina "web" y se reenvia a PHP-FPM por FastCGI.
# ---------------------------------------------------------------------------

- name: Desplegar el virtual host de NGINX
  ansible.builtin.template:
    src: zonasrunning-fpm.conf.j2
    dest: "{{ nginx_config_dir }}/{{ nginx_site_name }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Verificar la sintaxis de la configuracion de NGINX
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  become: true
  register: nginx_syntax_check
  failed_when: nginx_syntax_check.rc != 0

- name: Configurar el pool www de PHP-FPM
  ansible.builtin.include_tasks: pool.yml
  tags:
    - php
    - pool
