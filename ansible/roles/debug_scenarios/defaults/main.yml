---
# ---------------------------------------------------------------------------
# Valores por defecto del rol debug_scenarios
# ---------------------------------------------------------------------------
#
# El security group de PHP-FPM abre el `fpm_fastcgi_port` (9000) desde el SG
# de la maquina de NGINX, que es donde realmente escucha PHP-FPM.
#
# La directiva fastcgi_pass del NGINX apunta al `fpm_fastcgi_backend_port`.
# Esa variable la define Terraform (ver terraform/environments/v3-debug.tfvars)
# y llega al inventario por el output `fpm_fastcgi_backend_port`.

# Carpetas del codigo de la aplicacion que se retiran en la maquina de
# PHP-FPM: public/, src/, nginx/, fpm/ y php/.
#
# Se dejan intactos el directorio .git y los ficheros sueltos de la raiz,
# para que el repositorio siga siendo un clon de git valido.
debug_removed_app_paths:
  - "public"
  - "src"
  - "nginx"
  - "fpm"
  - "php"
